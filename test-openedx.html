            <p><strong>Bientôt, l'IA deviendra aussi intelligente que les humains.</strong></p>
            <p><em>La réalité :</em> il n'existe aucun consensus d'experts sur la distance qui nous sépare de la création d'une machine qui égale ou surpasse l'intelligence humaine dans un large éventail de tâches.</p>
            <p>Le chemin et le calendrier menant à une IA de niveau humain font l'objet de vifs débats parmi les experts. Les systèmes d'IA sont de plus en plus performants dans l'exécution de tâches autrefois réservées aux humains. Certains surpassent largement les capacités humaines dans des domaines spécifiques, comme les échecs.</p>
            <p>Certains experts estiment que les techniques d'IA actuelles sont proches de l'intelligence artificielle générale (IAG) et qu'avec des améliorations progressives, elles pourraient égaler, voire surpasser, l'intelligence humaine.</p>
